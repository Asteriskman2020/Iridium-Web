# Iridium ground station — nginx reverse proxy with TLS.
#
# Mounts the app at https://<your-host>/iridium/ and proxies to the container,
# which listens only on 127.0.0.1:8890.
#
# Install:  sudo cp iridium.conf /etc/nginx/conf.d/iridium.conf
#           sudo nginx -t && sudo systemctl reload nginx
#
# If <your-host> already has a server block for port 80/443 in another file,
# do NOT add a second one — copy just the `location /iridium/` block below into
# the existing server block instead, or nginx will complain about a duplicate
# default server.

server {
    listen 80;
    listen [::]:80;
    server_name <your-host>;

    # Certbot writes its challenge files here; this must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <your-host>;

    ssl_certificate     /etc/letsencrypt/live/<your-host>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-host>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- the existing static site keeps serving the root ----
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # ---- Iridium ground station ----
    # The trailing slash on proxy_pass strips "/iridium" before it reaches the
    # app; X-Forwarded-Prefix hands it back so Flask's url_for() and the
    # webhook URL shown on the dashboard both come out with the prefix.
    location /iridium/ {
        proxy_pass http://127.0.0.1:8890/;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Prefix /iridium;

        # An MT send waits on the RockBLOCK web service; the app allows 30 s for
        # it, so nginx must not give up first.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Ground Control allows 3 seconds for the webhook to answer. Buffering
        # a 200-byte form post adds nothing but latency.
        proxy_buffering off;
        client_max_body_size 64k;
    }

    # Redirect the bare /iridium to /iridium/ so relative URLs resolve.
    location = /iridium {
        return 301 https://$host/iridium/;
    }
}
