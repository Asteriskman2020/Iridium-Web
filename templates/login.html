<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iridium ground station</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background:#0b1120; color:#e6edf7; }
  .card { width:min(92vw,380px); background:#121a2b; border:1px solid #223049;
          border-radius:14px; padding:28px; box-shadow:0 18px 50px #0006; }
  h1 { margin:0 0 4px; font-size:1.25rem; }
  p.sub { margin:0 0 22px; color:#8fa3c0; font-size:.85rem; }
  label { display:block; font-size:.8rem; color:#9cc4ff; margin-bottom:6px; }
  input { width:100%; padding:11px 12px; border-radius:8px; font-size:1rem;
          border:1px solid #2c3d5c; background:#0d1524; color:#e6edf7; }
  input:focus { outline:2px solid #2f6feb; outline-offset:0; border-color:#2f6feb; }
  button { width:100%; margin-top:18px; padding:12px; border:0; border-radius:8px;
           background:#2f6feb; color:#fff; font-weight:600; font-size:1rem;
           cursor:pointer; }
  button:hover { background:#4680f5; }
  .err { margin-top:14px; padding:10px 12px; border-radius:8px; font-size:.85rem;
         background:#3b1620; border:1px solid #7d2436; color:#ffb4c0; }
  .sat { font-size:1.6rem; }
</style>
</head>
<body>
  <form class="card" method="post">
    <div class="sat">🛰️</div>
    <h1>Iridium ground station</h1>
    <p class="sub">RockBLOCK 9603 · short burst data</p>

    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autofocus autocomplete="current-password">

    <button type="submit">Sign in</button>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
