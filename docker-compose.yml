services:
  iridium-web:
    build: .
    image: iridium-web:latest
    container_name: iridium-web
    restart: unless-stopped
    ports:
      # Default 127.0.0.1 = reachable only from the host, for debugging; a
      # reverse proxy in a container cannot use this and talks to
      # iridium-web:8899 over the shared network instead.
      #
      # Set BIND_ADDR=0.0.0.0 in .env to publish it to the internet. Do that
      # only deliberately: Docker writes its own iptables rules, so a published
      # port is reachable even when the host firewall says it is closed, and
      # without a proxy in front there is no TLS — the console password and the
      # RockBLOCK credentials would cross the network in clear.
      #
      # If you publish it, you MUST also set BEHIND_TLS=false, or the session
      # cookie is marked Secure, the browser refuses to send it over plain
      # HTTP, and logging in silently fails with no error message.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8890}:8899"
    environment:
      # Values come from a .env file beside this one, or from Portainer's stack
      # environment variables — never edited into this file, which is public.
      # Sessions are invalidated if SECRET_KEY changes; the :? makes compose
      # refuse to start rather than silently run with a random per-boot key.
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      # Blank is allowed: the app then generates a random console password and
      # prints it once to the container log.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # Marks the session cookie Secure — only correct behind TLS.
      BEHIND_TLS: "${BEHIND_TLS:-true}"
      DB_PATH: /data/iridium.db
      # Optional seeds. Leave unset and fill them in on the Settings page, which
      # keeps the RockBLOCK password off the disk entirely.
      ROCKBLOCK_USER: "${ROCKBLOCK_USER:-}"
      ROCKBLOCK_PASS: "${ROCKBLOCK_PASS:-}"
      ROCKBLOCK_IMEI: "${ROCKBLOCK_IMEI:-}"
    volumes:
      - iridium_data:/data
    # If your reverse proxy is caddy-docker-proxy (image
    # lucaslorentz/caddy-docker-proxy), it builds its config from labels and
    # ignores any Caddyfile. Uncomment these, set the hostname, and it
    # configures itself — including the TLS certificate:
    #
    # labels:
    #   caddy: iridium.example.com
    #   caddy.reverse_proxy: "{{upstreams 8899}}"
    #
    # With a plain Caddy, leave them commented and add the site block from
    # DEPLOY.md instead.
    networks:
      - default
      # Shared network with a FIXED name so a reverse proxy running in another
      # container can be attached to it without knowing anything about this
      # stack:  docker network connect iridium_net <proxy-container>
      # The proxy then reaches this app as  http://iridium-web:8899
      # (container port — the 8890 host mapping above is only for debugging
      # from the host itself and is not reachable from another container).
      - iridium_net

volumes:
  iridium_data:

networks:
  iridium_net:
    name: iridium_net
